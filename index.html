<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>e북 뷰어</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f5f3ee;
    --surface: #ffffff;
    --border: #e0ddd6;
    --text-primary: #1a1a18;
    --text-secondary: #6b6860;
    --accent: #2d5a3d;
    --accent-light: #e8f0eb;
    --shadow: 0 4px 24px rgba(0,0,0,0.10);
    --radius: 10px;
  }

  body {
    font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 2rem;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-logo {
    font-size: 15px;
    font-weight: 600;
    color: var(--accent);
  }

  .header-file {
    font-size: 13px;
    color: var(--text-secondary);
  }

  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2rem 1rem;
    gap: 1.5rem;
  }

  #loading-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1rem;
    margin-top: 4rem;
  }

  .spinner {
    width: 36px;
    height: 36px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  #loading-text {
    font-size: 14px;
    color: var(--text-secondary);
  }

  #error-screen {
    display: none;
    flex-direction: column;
    align-items: center;
    gap: 0.75rem;
    margin-top: 4rem;
    text-align: center;
  }

  #error-screen .icon { font-size: 48px; }
  #error-screen p { font-size: 14px; color: var(--text-secondary); line-height: 1.7; }

  #controls {
    display: none;
    align-items: center;
    gap: 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 16px;
    width: 100%;
    max-width: 720px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .ctrl-group {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .ctrl-sep {
    width: 1px;
    height: 24px;
    background: var(--border);
  }

  button.ctrl-btn {
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 13px;
    color: var(--text-primary);
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
    font-family: inherit;
  }

  button.ctrl-btn:hover:not(:disabled) {
    background: var(--accent-light);
    border-color: var(--accent);
    color: var(--accent);
  }

  button.ctrl-btn:disabled {
    opacity: 0.35;
    cursor: default;
  }

  .page-info {
    font-size: 13px;
    color: var(--text-secondary);
    white-space: nowrap;
  }

  .page-info span {
    color: var(--text-primary);
    font-weight: 600;
  }

  #page-jump {
    width: 52px;
    font-size: 13px;
    text-align: center;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 5px 6px;
    font-family: inherit;
    color: var(--text-primary);
    background: var(--bg);
  }

  .zoom-label {
    font-size: 13px;
    color: var(--text-secondary);
    min-width: 38px;
    text-align: center;
  }

  #canvas-container {
    display: none;
    justify-content: center;
    width: 100%;
    max-width: 860px;
  }

  #pdf-canvas {
    max-width: 100%;
    display: block;
    border-radius: 4px;
    box-shadow: var(--shadow);
  }

  footer {
    text-align: center;
    padding: 1.5rem;
    font-size: 12px;
    color: var(--text-secondary);
    border-top: 1px solid var(--border);
    background: var(--surface);
  }

  @media (max-width: 600px) {
    header { padding: 0 1rem; }
  }
</style>
</head>
<body>

<header>
  <span class="header-logo">📖 e북 뷰어</span>
  <span class="header-file" id="header-info"></span>
</header>

<main>
  <div id="loading-screen">
    <div class="spinner"></div>
    <p id="loading-text">파일을 불러오는 중...</p>
  </div>

  <div id="error-screen">
    <span class="icon">😥</span>
    <p>파일을 불러올 수 없습니다.<br>저장소에 <strong>book.pdf</strong> 파일이 있는지 확인해 주세요.</p>
  </div>

  <div id="controls">
    <div class="ctrl-group">
      <button class="ctrl-btn" id="prev-btn" onclick="changePage(-1)" disabled>◀ 이전</button>
      <span class="page-info"><span id="cur-page">1</span> / <span id="total-pages">1</span></span>
      <button class="ctrl-btn" id="next-btn" onclick="changePage(1)">다음 ▶</button>
    </div>
    <div class="ctrl-sep"></div>
    <div class="ctrl-group">
      <input type="number" id="page-jump" min="1" placeholder="페이지"
        onkeydown="if(event.key==='Enter')jumpPage()">
      <button class="ctrl-btn" onclick="jumpPage()">이동</button>
    </div>
    <div class="ctrl-sep"></div>
    <div class="ctrl-group">
      <button class="ctrl-btn" onclick="changeZoom(-0.25)">−</button>
      <span class="zoom-label" id="zoom-label">100%</span>
      <button class="ctrl-btn" onclick="changeZoom(0.25)">+</button>
    </div>
  </div>

  <div id="canvas-container">
    <canvas id="pdf-canvas"></canvas>
  </div>
</main>

<footer>이 뷰어는 다운로드 없이 브라우저에서만 열람 가능합니다.</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc =
  'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

let pdfDoc = null, curPage = 1, totalPages = 0, scale = 1.5;
let rendering = false, pendingPage = null;

const canvas = document.getElementById('pdf-canvas');
const ctx = canvas.getContext('2d');

pdfjsLib.getDocument('book.pdf').promise.then(pdf => {
  pdfDoc = pdf;
  totalPages = pdf.numPages;
  curPage = 1;
  document.getElementById('total-pages').textContent = totalPages;
  document.getElementById('page-jump').max = totalPages;
  document.getElementById('header-info').textContent = totalPages + '페이지';
  document.getElementById('loading-screen').style.display = 'none';
  document.getElementById('controls').style.display = 'flex';
  document.getElementById('canvas-container').style.display = 'flex';
  renderPage(1);
}).catch(() => {
  document.getElementById('loading-screen').style.display = 'none';
  document.getElementById('error-screen').style.display = 'flex';
});

function renderPage(num) {
  rendering = true;
  document.getElementById('cur-page').textContent = num;
  document.getElementById('prev-btn').disabled = num <= 1;
  document.getElementById('next-btn').disabled = num >= totalPages;

  pdfDoc.getPage(num).then(page => {
    const vp = page.getViewport({ scale });
    canvas.width = vp.width;
    canvas.height = vp.height;
    return page.render({ canvasContext: ctx, viewport: vp }).promise;
  }).then(() => {
    rendering = false;
    window.scrollTo({ top: 0, behavior: 'smooth' });
    if (pendingPage !== null) {
      const p = pendingPage; pendingPage = null; renderPage(p);
    }
  });
}

function changePage(dir) {
  const np = curPage + dir;
  if (np < 1 || np > totalPages) return;
  curPage = np;
  if (rendering) pendingPage = curPage;
  else renderPage(curPage);
}

function jumpPage() {
  const v = parseInt(document.getElementById('page-jump').value);
  if (v >= 1 && v <= totalPages) {
    curPage = v;
    if (rendering) pendingPage = curPage;
    else renderPage(curPage);
    document.getElementById('page-jump').value = '';
  }
}

function changeZoom(delta) {
  scale = Math.max(0.5, Math.min(3.5, scale + delta));
  document.getElementById('zoom-label').textContent = Math.round(scale / 1.5 * 100) + '%';
  if (pdfDoc) renderPage(curPage);
}

canvas.addEventListener('contextmenu', e => e.preventDefault());
canvas.addEventListener('dragstart', e => e.preventDefault());

document.addEventListener('keydown', e => {
  if (!pdfDoc) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') changePage(1);
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') changePage(-1);
});
</script>
</body>
</html>
